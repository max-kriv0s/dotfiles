# Линтер: actionlint (выбирается по пути, тип файла остаётся yaml).
# Схема GitHub Actions подключится через SchemaStore — следующий шаг Фазы 3.
#
# Намеренные ошибки для проверки actionlint:
#   - runs-on: ubuntu-latests   — несуществующий раннер, опечатка
#   - needs: buidl              — ссылка на несуществующую job
#   - ${{ github.event.inputs.x }} — обращение к входу, которого нет

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latests
    steps:
      - uses: actions/checkout@v4
      - name: Установить зависимости
        run: npm ci
      - name: Собрать
        run: npm run build

  test:
    needs: buidl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Прогнать тесты
        run: npm test
        env:
          MODE: ${{ github.event.inputs.x }}
