# Проверка правил из core/filetypes.lua: :echo &filetype -> yaml.gitlab
# Схема GitLab CI подключится через SchemaStore.

stages:
  - build
  - test

build:
  stage: build
  image: node:22-alpine
  script:
    - npm ci
    - npm run build

test:
  stage: test
  image: node:22-alpine
  script:
    - npm test
