# LSP: ansiblels. Линтер: ansible-lint.
# Проверка правил из core/filetypes.lua: :echo &filetype -> yaml.ansible
# Срабатывает и по имени site.yml, и по каталогу playbooks/

- name: Настроить веб-сервер
  hosts: web
  become: true

  tasks:
    - name: Установить nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Запустить nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
