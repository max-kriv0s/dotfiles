# Префикс Ctrl+A
set -g prefix C-a

# Основные настройки
set -g default-terminal "tmux-256color"
#set -ga terminal-overrides ",xterm-256color:Tc"

set -g extended-keys on
#set -ga terminal-overrides ",ghostty:Tc"
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-256color:extkeys'

set -g allow-passthrough on

# Изменение индексов
set -g base-index 1           # нумерация окон с 1 (не с 0)
set -g pane-base-index 1      # нумерация панелей с 1

set -g mouse on               # мышь: скролл, клик по панелям
set -g renumber-windows on    # перенумеровать окна при закрытии
set -g history-limit 10000    # история команд (строк буфера на панель)
# set -g alternate-screen off   # вывод full-screen программ (vim, htop, claude) идёт в обычный
#                               # scrollback вместо отдельного alt-screen буфера — иначе он
#                               # недоступен через copy-mode, даже когда виден на экране

set -g alternate-screen on    # Полноэкранные программы (nvim, less, htop) используют отдельный экран и
                              # после выхода возвращают чистый shell. Их содержимое не остаётся в scrollback.
set -sg escape-time 0         # убрать задержку после Escape (важно для nvim)
set -g focus-events on        # события фокуса (нужно для nvim)

# Сортировка сессий по имени
bind s choose-tree -sZ -O name

# Горячие клавиши — окна
bind c new-window -c "#{pane_current_path}"   # новое окно в текущей папке
bind , command-prompt "rename-window '%%'"    # переименовать окно

# Горячие клавиши — панели
unbind %
bind-key '\' split-window -h -c "#{pane_current_path}"  # вертикальный split

unbind '"'
bind - split-window -v -c "#{pane_current_path}"  # горизонтальный split

# Перезагрузка конфигурации
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Навигация между панелями как в vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+h/j/k/l намеренно не назначены: они нужны в оболочке (Ctrl+l чистит
# экран, Ctrl+k удаляет строку до конца). Переход из nvim в соседнюю панель
# tmux этими клавишами всё равно работает — плагин vim-tmux-navigator
# выполняет select-pane сам, со стороны nvim.

# Изменение размера панелей
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Горячие клавиши — сессии
# выбор сессии — bind s задан выше как choose-tree, он информативнее
bind $ command-prompt "rename-session '%%'"  # переименовать сессию

# Копирование (vi режим)
set -g mode-keys vi
bind Enter copy-mode          # войти в режим копирования
bind -T copy-mode-vi v send -X begin-selection      # выделение как в vim
bind -T copy-mode-vi y send -X copy-selection-and-cancel  # копировать
bind -T copy-mode-vi Escape send -X cancel          # выйти

bind x kill-pane # Закрытие панели без подтверждения

# Дубли биндов для русской раскладки (ЙЦУКЕН)
# tmux матчит присланный символ, а не физическую клавишу — на RU-раскладке
# h/j/k/l/c/x/r/s/v/y/g/G превращаются в кириллицу, и бинды не срабатывают.
# Ctrl-комбинации (префикс C-a и т.п.) этой проблемы не имеют — их не трогаем.
bind с new-window -c "#{pane_current_path}"                 # c
bind б command-prompt "rename-window '%%'"                  # ,
bind к source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"  # r
bind ч kill-pane                                             # x
bind ы choose-tree -sZ -O name                               # s
bind в detach-client                                         # d
# Дубль для $ (переименовать сессию) зависит от системы: на macOS русская
# раскладка не PC, и Shift+4 даёт %, а на Linux — ;
if-shell '[ "$(uname)" = "Darwin" ]' \
  "bind % command-prompt \"rename-session '%%'\"" \
  "bind ';' command-prompt \"rename-session '%%'\""          # $

bind р select-pane -L   # h
bind о select-pane -D   # j
bind л select-pane -U   # k
bind д select-pane -R   # l

bind -r Р resize-pane -L 5   # H
bind -r О resize-pane -D 5   # J
bind -r Л resize-pane -U 5   # K
bind -r Д resize-pane -R 5   # L

# copy-mode-vi (после Ctrl+A Enter) — включая навигацию по истории
bind -T copy-mode-vi м send -X begin-selection             # v — выделение
bind -T copy-mode-vi н send -X copy-selection-and-cancel   # y — копировать
bind -T copy-mode-vi р send -X cursor-left                 # h
bind -T copy-mode-vi о send -X cursor-down                 # j
bind -T copy-mode-vi л send -X cursor-up                   # k
bind -T copy-mode-vi д send -X cursor-right                # l
bind -T copy-mode-vi п send -X history-top                 # g — начало истории
bind -T copy-mode-vi П send -X history-bottom              # G — конец истории

# Плагины (TPM)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'   # разумные дефолты
set -g @plugin 'tmux-plugins/tmux-resurrect'  # сохранение сессий
set -g @plugin 'tmux-plugins/tmux-continuum'  # автосохранение сессий

# Настройки плагинов

# Сохранение сессий
set -g @continuum-restore 'on'   # автовосстановление сессий при старте
set -g @resurrect-capture-pane-contents 'on' #  сохраняет содержимое панелей (текст который виден на экране)

# Сессии хранятся тут ~/.local/share/tmux/resurrect
# Для удаления команда rm -rf ~/.local/share/tmux/resurrect

# keys
# set -g terminal-overrides "xterm*:smkx@:rmkx@"

# Статус-бар
set -g status-justify centre
set -g status-style bg=default
set -g status-left '#S'
set -g status-right '#H / %d.%m.%Y %H:%M'

# Инициализация TPM (всегда в конце файла)
run '~/.tmux/plugins/tpm/tpm'
